{% extends "base.html" %}

{% block content %}
<div class="container">

  <!-- Бренд/логотип -->
  <div class="brand">
    <h1>WOLK</h1>
    <span class="bot-label">bot</span>
  </div>

  <!-- Заголовок Ленты -->
  <div class="feed-header">
    <h1 class="feed-title">Лента</h1>
    <div class="feed-actions">
      <button data-show-icon="true" data-show-search="true" data-type="Basic" class="search-btn">
        <div class="search_01">
          <img src="{{ url_for('static', filename='images/magnify.svg') }}">
        </div>
        <div class="search"><span class="search_span">Поиск</span></div>
      </button>
      <button class="filter-btn">
        <div class="filter_01">
          <img src="{{ url_for('static', filename='images/tune-variant.svg') }}">
        </div>
      </button>
    </div>
  </div>

  <!-- Меню ленты -->
  <nav class="feed-menu">
    <ul>
      <li><a href="#" class="menu-item"><input type="checkbox" id="all" checked> <label for="all">Все</label></a></li>
      <li><a href="#" class="menu-item"><input type="checkbox" id="orders"> <label for="orders">Заказы</label></a></li>
      <li><a href="#" class="menu-item"><input type="checkbox" id="performers"> <label for="performers">Исполнители</label></a></li>
    </ul>
  </nav>

  <!-- Рекомендованные заказы -->
  <section class="recommended">
    <h2>РЕКОМЕНДОВАННЫЕ</h2>
    
    <div class="job-card">
      <div class="job-category">КОПИРАЙТИНГ</div>
      <h3 class="job-title">Написать текст</h3>
      <p class="job-description">Нужно написать статью и поправить текст, в документе...</p>
      <div class="job-meta">
        <span class="price">$50</span>
        <span class="time-ago">2 часа назад</span>
      </div>
    </div>
    
    <!-- Здесь будут другие рекомендованные заказы -->
  </section>

  <!-- Нижнее меню -->
  <nav class="bottom-nav">
    <a href="#" class="nav-item active"><i class="icon-feed"></i> Лента</a>
    <a href="#" class="nav-item"><i class="icon-messages"></i> Сообщения</a>
    <a href="#" class="nav-item"><i class="icon-profile"></i> Профиль</a>
  </nav>
</div>
{% endblock %}
